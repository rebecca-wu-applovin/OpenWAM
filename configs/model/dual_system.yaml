# Dual-System WAM: separate ActionDiT + video DiT.
#   joint_cross_attn: video runs to completion; ActionDiT cross-attends its bridge features.
#   joint_self_attn:  one mixed video/action self-attention per layer (MoT).

defaults:
  - video_backbone: wan22_ti2v_5b        # wan22_ti2v_5b | cosmos3_edge | cosmos3_nano
  - action_backbone: separate_action_dit # dual-system only supports ActionDiT
  - _self_

# Pretrained components kept frozen; entries missing on the active backbone are skipped.
freeze:
  - video_backbone.text_encoder
  - video_backbone.vae

architecture:
  framework: dual_system
  variant: joint_self_attn   # joint_self_attn | joint_cross_attn

  action_dim: 80             # 80 = unified action space (unify_action=true); raw width otherwise (e.g. yam_sharpa fingertips_* = 48)
  use_proprioception: true   # true = dataloader must provide sample["proprio"], appended as one proprio token
  state_dim: 80              # proprio width; required when use_proprioception=true

  # Video<->action visibility (joint_self_attn only):
  #   mutual | action_sees_video | video_sees_action | isolated
  attention_mask_mode: mutual
  # Video<->video visibility: first_frame_causal | per_frame_causal | bidirectional
  video_attention_mask_mode: first_frame_causal

  # ActionDiT layer selection: explicit list, or null + bridge_interval (1 = every layer, 2 = every other).
  # joint_cross_attn: which video layers feed the bridge; joint_self_attn: sizes ActionDiT.
  bridge_layers: null
  bridge_interval: 1

  mot_checkpoint_mixed_attn: true  # joint_self_attn only: grad-checkpoint the mixed attention (VRAM down)
  detach_bridge: false             # joint_cross_attn only
