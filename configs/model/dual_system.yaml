# Dual-System WAM: separate ActionDiT + video DiT.
#   joint_cross_attn: video runs to completion; ActionDiT cross-attends its bridge features.
#   joint_self_attn:  one mixed video/action self-attention per layer (MoT).

defaults:
  - video_backbone: wan22_ti2v_5b        # any configs/model/video_backbone/*.yaml (package _global_: also sets training.*)
  - action_backbone: separate_action_dit # dual-system only supports ActionDiT
  - _self_

architecture:
  framework: dual_system
  variant: joint_self_attn   # joint_self_attn | joint_cross_attn

  # action / proprio widths: common.action_dim / common.state_dim (configs/train.yaml)
  use_proprioception: true   # true = one proprio token per history frame, appended to ActionDiT's text context
  # How the video backbone sees the proprio: context_token (the same appended tokens as ActionDiT) |
  # backbone_stream (the backbone embeds it in its own stream; flux, whose yaml requires it).
  proprio_input: context_token

  # Video<->action visibility (joint_self_attn only): mutual (the only implemented one;
  # action_sees_video | video_sees_action | isolated are reserved and rejected by resolve_config)
  attention_mask_mode: mutual
  # Among the clean (history) latents: bidirectional | causal (latent i sees 0..i). Clean latents never see
  # the noisy latents or the action; noisy latents and the action see everything.
  clean_attention: bidirectional
  # How the H - 1 past history frames are encoded: per_frame (each alone, H - 1 latents) | clip (one causal
  # clip, 1 + (H - 2) / tc latents; needs H - 1 = 1 + tc*k). The current frame is always encoded alone.
  history_encoding: per_frame

  # joint_cross_attn: the video layers that feed the ActionDiT bridges (one block each) are
  # range(0, video_backbone.geometry.num_layers, bridge_interval) (1 = every layer, 2 = every other).
  # joint_self_attn: must be 1 (one mixed attention per video layer; resolve_config rejects other values).
  bridge_interval: 1

  detach_bridge: false             # joint_cross_attn only
