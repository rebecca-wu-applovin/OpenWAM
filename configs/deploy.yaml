# Deploy config of one sparse-history yam_sharpa checkpoint: the `deploy` block merged onto the checkpoint's own
# config.yaml (openwam/deploy/config.py: build_deploy_cfg). Override any key with a `deploy.<key>=<value>` dotlist
# entry; the checkpoint's model / data config cannot be changed at deploy time.

ckpt:
  dir: null              # required: run dir (config.yaml + normalization_stats.npy + checkpoint_step_*.safetensors)
  name: null             # required: checkpoint_step_N.safetensors (no "latest" guess: the served weights are explicit)

server:
  host: 0.0.0.0
  port: 8848
  device: cuda:0

# Data shape the deploy expects. It must equal the checkpoint's dataloader.num_frames / height / width (checked at
# startup, never used as a fallback); kept separate so train and inference shapes may differ one day.
# Values: the sparse-history sweeps (07 / 1022), all trained at 384x224.
data:
  num_frames: 33
  height: 384
  width: 224

policy:
  steps_per_plan: null   # required K: actions returned per plan = steps executed between two observations;
                         # must divide dataloader.fps and every history offset
  seed: 42               # sampling seed of every plan of an episode, unless the client names one

sampler:
  denoise_steps: 10
  denoise_mode: sync     # sync | async (denoising trajectory)
  lead_modality: video   # async only: action | video
  variance_shift_alpha: 1.0   # async only: lead-curve shift, >= 1
  linear_offset: 0.0     # async only: lag start delay, 0 <= value < 1
  decode_video: false    # also decode each plan's future video (debugging)
