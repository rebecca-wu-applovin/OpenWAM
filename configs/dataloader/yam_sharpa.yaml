type: yam_sharpa

# YAM-duo arms + Sharpa hands, LeRobot v3 (20 fps), ego + chest cameras.
# Plan / design: docs/1008_our_dataset_support/plan.md

# ── Sources + sampling probability ───────────────────────────────────────────
# Each draw picks a source with probability weight / sum(weights), then a
# uniformly random window of that source.
sources:
  simteleop:
    dataset_dir: /root/projects/2610_policy_model/datasets/simteleop_1004/dataset
    weight: 0.5
    enabled: true  # false = skip this source
  gpt_rollout:
    dataset_dir: /root/projects/2610_policy_model/datasets/gpt_rollout/dataset
    weight: 0.5
    enabled: true  # false = skip this source
seed: ${project.seed}  # the run seed (an int; resolve_config rejects null)

# ── Action / proprio representation (ablation switch) ────────────────────────
#   fingertips_abs | fingertips_rel  → 48-D:  common.action_dim=48 common.state_dim=48
#   unify_abs      | unify_rel       → 80-D:  common.action_dim=80 common.state_dim=80
# unify_action / unify_action_map are derived from action_mode (do not set them).
action_mode: fingertips_abs

# ── Normalization ────────────────────────────────────────────────────────────
# One pooled min-max file per action_mode, shared by all sources; built on
# first use (rank 0 scans, other ranks wait) and copied into checkpoints.
normalize_mode: min-max
normalization_stats_path: /root/projects/2610_policy_model/norm_stats/yam_sharpa_${.action_mode}.npy

# ── Frame sampling ───────────────────────────────────────────────────────────
# fps: the data rate (rows per second), checked against each source's meta/info.json. Row offsets and the action
# chunk are in these rows; deploy serves actions at this rate.
fps: 20
# 33 raw rows → 32 actions. Video = the history rows t + history_offsets (the last one = the current frame t)
# then the future rows t + future_offsets. The default is the first-frame layout: frame t + 8 future frames
# every 4th row (rows t .. t+32). history_offsets alone sets H (the latent layout is derived from it).
num_frames: 33
history_offsets: [0]
future_offsets: [4, 8, 12, 16, 20, 24, 28, 32]
# How the train split picks the history rows: fixed = always history_offsets; random = per sample, H-1 distinct
# rows of the past history_window rows (100 = 5 s at 20 Hz) + frame t, drawn from the sample's (seed, epoch, idx)
# RNG, then clamped to the episode start. H stays len(history_offsets); val and deploy always use history_offsets
# (resolve_config checks that history_window reaches the oldest offset).
history_sampling: fixed
history_window: 100
# Caption dropout (train split only): the prompt becomes "" with this probability, drawn from the same per-sample
# (seed, epoch, idx) RNG after the history offsets. Launch scripts set the backbone's recipe value (GE 0.06, flux 0.1).
caption_dropout_p: 0.0
window_stride: 1

# ── Rendering: cameras stacked top-to-bottom ─────────────────────────────────
# 2 x (240x320) → 480x320 canvas (150 tokens per latent).
height: 480
width: 320
camera_layout: [observation.images.ego_view, observation.images.chest_view]

# ── Video augmentation ───────────────────────────────────────────────────────
color_jitter:
  enabled: true
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
